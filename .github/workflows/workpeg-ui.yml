name: Roomay UI Check

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  workpeg-ui:
    name: Workpeg UI build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server-requirements.txt

      - name: Install Workpeg SDK and backend test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node for compiled UI offline tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python syntax check
        run: python -m compileall -q ui function domain tests backend migrations

      - name: Offline hotel rules and compiled smoke UI
        run: python -m unittest discover -s tests -v

      - name: Compile Workpeg UI
        run: workpeg ui build ui/
