name: Roomay UI Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workpeg-ui:
    name: Workpeg UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Temporary, runner-local database only. Never a hosted credential.
      ROOMAY_TEST_DATABASE_URL: postgresql+psycopg://roomay:roomay_ci_local_only@127.0.0.1:55432/roomay
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roomay
          POSTGRES_USER: roomay
          POSTGRES_PASSWORD: roomay_ci_local_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U roomay -d roomay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt
            server-requirements.txt

      - name: Install pinned Workpeg SDK and guest backend test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install isolated voice WSGI runtime
        run: python -m pip install -r requirements-voice.txt

      - name: Set up Node for compiled UI offline tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python syntax check
        run: python -m compileall -q ui function domain tests backend migrations public_intake

      - name: Offline rules and real PostgreSQL 16 backend integration
        run: python -m unittest discover -s tests -v

      - name: Build and start Railway voice container (offline provider smoke)
        run: ROOMAY_RUN_DOCKER_TESTS=1 python -m unittest tests.test_voice_docker_runtime -v

      - name: Build and smoke-test isolated Vapi intent tool (no provider calls)
        run: ROOMAY_RUN_DOCKER_TESTS=1 python -m unittest tests.test_voice_tool_docker_runtime -v

      - name: Compile Workpeg UI
        run: workpeg ui build ui/

      # Explicit release gate for pull requests into protected main.
      # Rebuild a fresh artifact; do not trust a previously generated ui/dist.
      - name: Block dev routes, privileged CRUD and secrets in release bundle (WOR-33)
        run: python -m unittest discover -s tests -p 'test_release_candidate.py' -v

      # Function package is inactive: verify the actual container, not only
      # the source-level contract, without Workpeg credentials or live calls.
      # --network=none prohibits Dockerfile RUN networking; Docker still pulls
      # the pinned, published base image before executing build instructions.
      - name: Build inactive Workpeg Function with no build-step network (WOR-71)
        run: docker build --network=none --pull --progress=plain -t roomay-function-smoke:ci ./function

      - name: Verify packaged Function refuses synthetic invocations (WOR-71)
        run: |
          docker run --rm --network none --entrypoint python roomay-function-smoke:ci -c '
          import inspect
          from app.main import main

          assert tuple(inspect.signature(main).parameters) == ("context", "payload")
          cases = [
              ({}, {}),
              ({"actor": "agent", "business": "synthetic"}, {"status": "confirmed"}),
              ({"business": "synthetic", "token": "placeholder-not-a-secret"},
               {"request": "fictional"}),
          ]
          for context, payload in cases:
              try:
                  main(context, payload)
              except RuntimeError as exc:
                  assert str(exc) == "roomay_function_not_configured"
              else:
                  raise AssertionError("Function unexpectedly accepted an invocation")
          print("PASS: packaged Function entrypoint is fail-closed")
          '
