name: Roomay UI Check

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  workpeg-ui:
    name: Workpeg UI build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt

      - name: Install pinned Workpeg SDK
        run: python -m pip install -r requirements-dev.txt

      - name: Install isolated voice WSGI runtime
        run: python -m pip install -r requirements-voice.txt

      - name: Set up Node for compiled UI offline tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python syntax check
        run: python -m compileall -q ui function domain tests

      - name: Offline hotel rules and compiled smoke UI
        run: python -m unittest discover -s tests -v

      - name: Build and start Railway voice container (offline provider smoke)
        run: ROOMAY_RUN_DOCKER_TESTS=1 python -m unittest tests.test_voice_docker_runtime -v

      - name: Compile Workpeg UI
        run: workpeg ui build ui/

      # Explicit release gate for pull requests into staging AND main.
      # Rebuild a fresh artifact; do not trust a previously generated ui/dist.
      - name: Block dev routes, privileged CRUD and secrets in release bundle (WOR-33)
        run: python -m unittest discover -s tests -p 'test_release_candidate.py' -v
